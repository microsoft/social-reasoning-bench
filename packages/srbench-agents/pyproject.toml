[project]
name = "srbench-agents"
version = "0.1.0"
description = "Example bring-your-own-agent (BYOA) implementations for srbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "srbench[mcp]",
    "openai>=2.11.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["srbench_agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
srbench = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
